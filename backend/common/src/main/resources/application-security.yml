service:
  security:
    enabled: true

    internal-secret: ${INTERNAL_SECRET}

    admin-token: ${ADMIN_TOKEN}

    admins: ${ADMIN_USER_IDS}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}

logging:
  level:
    com.vpn.common.security: DEBUG
    com.vpn.common.security.filter.SecurityFilter: TRACE
    com.vpn.common.security.aspect.SecurityAspect: DEBUG

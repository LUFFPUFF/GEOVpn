x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ─────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────
  vpn-postgres:
    image: postgres:15-alpine
    container_name: vpn-postgres
    restart: always
    env_file: .env
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vpn-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vpn-redis:
    image: redis:7-alpine
    container_name: vpn-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - vpn-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # BACKEND SERVICES
  # ─────────────────────────────────────────

  vpn-api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: vpn-api-gateway
    restart: always
    env_file: .env
    environment:
      - SERVICE_JWT_SECRET=${JWT_SECRET}
      - SERVICE_JWT_EXPIRATION=${JWT_EXPIRATION}
      - SERVICE_JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - vpn-network
    logging: *default-logging
    depends_on:
      vpn-postgres: { condition: service_healthy }
      vpn-redis: { condition: service_healthy }

  vpn-user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: vpn-user-service
    restart: always
    env_file: .env
    environment:
      - TELEGRAM_PROXY_HOST=
      - TELEGRAM_PROXY_PORT=0
      - SPRING_DATA_REDIS_HOST=vpn-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_DATA_REDIS_PASSWORD=fQ0xOI8fnEbgNlXQVJhKuxFoqXfI8MQ0
      - SPRING_DATA_REDIS_URL=redis://:fQ0xOI8fnEbgNlXQVJhKuxFoqXfI8MQ0@vpn-redis:6379
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - vpn-network
    logging: *default-logging
    depends_on:
      vpn-postgres: { condition: service_healthy }

  vpn-config-service:
    build:
      context: ./backend
      dockerfile: vpn-config-service/Dockerfile
    container_name: vpn-config-service
    restart: always
    env_file: .env
    environment:
      - SPRING_DATA_REDIS_HOST=vpn-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_DATA_REDIS_PASSWORD=fQ0xOI8fnEbgNlXQVJhKuxFoqXfI8MQ0
      - SPRING_DATA_REDIS_URL=redis://:fQ0xOI8fnEbgNlXQVJhKuxFoqXfI8MQ0@vpn-redis:6379
      - VPN_SUBSCRIPTION_BASE_URL=https://geovp.ru
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - vpn-network
    logging: *default-logging
    depends_on:
      vpn-postgres: { condition: service_healthy }

  vpn-server-management:
    build:
      context: ./backend
      dockerfile: server-management-service/Dockerfile
    container_name: vpn-server-management
    restart: always
    env_file: .env
    environment:
      - SPRING_DATA_REDIS_HOST=vpn-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_DATA_REDIS_PASSWORD=fQ0xOI8fnEbgNlXQVJhKuxFoqXfI8MQ0
      - SPRING_DATA_REDIS_URL=redis://:fQ0xOI8fnEbgNlXQVJhKuxFoqXfI8MQ0@vpn-redis:6379
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - vpn-network
    logging: *default-logging
    depends_on:
      vpn-postgres: { condition: service_healthy }

  vpn-telegram-bot:
    build:
      context: ./backend
      dockerfile: telegram-bot/Dockerfile
    container_name: vpn-telegram-bot
    restart: always
    environment:
      - TELEGRAM_PROXY_HOST=
      - TELEGRAM_PROXY_PORT=0
      - JAVA_OPTS=-Xms256m -Xmx512m
    extra_hosts:
      - "host-gateway:host-gateway"
    env_file: .env
    networks:
      - vpn-network
    logging: *default-logging
    depends_on:
      vpn-api-gateway: { condition: service_started }

  billing-service:
    build:
      context: ./backend
      dockerfile: billing-service/Dockerfile
    container_name: vpn-billing-service
    restart: always
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://vpn-postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_REDIS_HOST=vpn-redis
      - SPRING_REDIS_PORT=6379
      - USER_SERVICE_URL=http://vpn-user-service:8082
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - PLATEGA_MERCHANT_ID=${PLATEGA_MERCHANT_ID}
      - PLATEGA_SECRET_KEY=${PLATEGA_SECRET_KEY}
      - PLATEGA_RETURN_URL=${PLATEGA_RETURN_URL}
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - vpn-network
    logging: *default-logging
    depends_on:
      vpn-postgres: { condition: service_healthy }
      vpn-redis: { condition: service_healthy }

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: vpn-admin-panel
    restart: always
    networks:
      - vpn-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vpn-mini-app:
    build: ./mini-app
    container_name: vpn-mini-app
    restart: always
    networks:
      - vpn-network
    logging: *default-logging

  # ─────────────────────────────────────────
  # NGINX + CERTBOT
  # ─────────────────────────────────────────
  vpn-nginx:
    image: nginx:1.25-alpine
    container_name: vpn-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - vpn-network
    logging: *default-logging
    depends_on:
      - vpn-api-gateway

  certbot:
    image: certbot/certbot:latest
    container_name: vpn-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging: *default-logging

networks:
  vpn-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_conf:
